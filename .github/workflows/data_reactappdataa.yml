name: Build and deploy Node.js app to Azure Web App - reactappdataa

on:
  push:
    branches:
      - data
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Create server .env from secrets
        run: |
          mkdir -p server
          echo "DATABRICKS_HOST=${{ secrets.DATABRICKS_HOST }}" > server/.env
          echo "DATABRICKS_HTTP_PATH=${{ secrets.DATABRICKS_HTTP_PATH }}" >> server/.env
          echo "DATABRICKS_TOKEN=${{ secrets.DATABRICKS_TOKEN }}" >> server/.env
          echo "PORT=${{ secrets.PORT }}" >> server/.env

      - name: Install Dependencies
        run: npm install

      - name: Build Sub-Projects
        run: |
          # 1. Build Client
          npm run build -w client
          
          # 2. Build Server (Directly overriding the module flags to kill error TS1343)
          cd server
          npx tsc --module nodenext --moduleResolution nodenext --target esnext --outDir dist --rootDir src --esModuleInterop true --skipLibCheck true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .
            !**/node_modules/**

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4C5232F8F9994557909D3CD9C5D17C07 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_86CDFCE3A8E246E283EC5904A3C654D6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6F40690EAB89405798BE205F3C1D748E }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'reactappdataa'
          slot-name: 'Production'
          package: .
