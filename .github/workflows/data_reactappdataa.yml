name: Build and deploy Node.js app to Azure Web App - reactappdataa

on:
  push:
    branches:
      - data
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Create server .env from secrets
        run: |
          mkdir -p server
          cat > server/.env <<EOF
          DATABRICKS_HOST=${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH=${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN=${{ secrets.DATABRICKS_TOKEN }}
          PORT=${{ secrets.PORT }}
          EOF

      - name: Install and Build
        run: |
          # Install and build Client
          cd client
          npm install
          npm run build
          cd ..
          # Install Server dependencies
          cd server
          npm install
          cd ..

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4C5232F8F9994557909D3CD9C5D17C07 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_86CDFCE3A8E246E283EC5904A3C654D6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6F40690EAB89405798BE205F3C1D748E }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'reactappdataa'
          slot-name: 'Production'
          package: .
