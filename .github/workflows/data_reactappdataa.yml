name: Build and deploy Node.js app to Azure Web App - reactappdataa

on:
  push:
    branches:
      - data
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        # --ignore-scripts prevents npm from automatically running a 'build' that might fail
        run: npm install --ignore-scripts

      - name: Build Client
        run: npm run build -w client

      - name: Build Server (Manual Force)
        run: |
          cd server
          # 1. Delete the local config that is causing the error
          rm -f tsconfig.json
          
          # 2. Create a brand new, guaranteed correct config file
          cat > tsconfig.json <<EOF
          {
            "compilerOptions": {
              "target": "ESNext",
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "outDir": "./dist",
              "rootDir": "./src",
              "strict": true,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "allowJs": true
            }
          }
          EOF
          
          # 3. Run the compiler directly using the file we just created
          npx tsc -p tsconfig.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .
            !**/node_modules/**

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4C5232F8F9994557909D3CD9C5D17C07 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_86CDFCE3A8E246E283EC5904A3C654D6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6F40690EAB89405798BE205F3C1D748E }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'reactappdataa'
          slot-name: 'Production'
          package: .
