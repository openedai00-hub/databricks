name: Build and deploy Node.js app to Azure Web App - reactappdataa

on:
  push:
    branches:
      - data
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build Projects
        run: |
          # Build Client
          npm run build -w client
          # Build Server - navigating directly to avoid workspace script issues
          cd server
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4C5232F8F9994557909D3CD9C5D17C07 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_86CDFCE3A8E246E283EC5904A3C654D6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6F40690EAB89405798BE205F3C1D748E }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'reactappdataa'
          slot-name: 'Production'
          package: .
